name: checkov

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  # Keep in sync with the version used to generate terraform/.checkov.baseline.
  CHECKOV_VERSION: "3.3.19"

jobs:
  checkov:
    name: checkov (new violations only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install checkov
        run: pip install "checkov==${CHECKOV_VERSION}"

      - name: Run checkov against baseline
        run: checkov -d terraform --baseline terraform/.checkov.baseline --compact --quiet
