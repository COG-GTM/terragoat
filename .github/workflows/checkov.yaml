name: checkov
on:
  pull_request: {}
  push:
    branches:
      - master
      - main

permissions:
  contents: read

env:
  # Keep in sync with the version used to generate terraform/.checkov.baseline.
  # Newer checkov releases add checks, which would surface as "new" violations.
  CHECKOV_VERSION: "3.3.19"

jobs:
  checkov-baseline:
    name: checkov (new violations only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install checkov
        run: pip install "checkov==${CHECKOV_VERSION}"

      - name: Run checkov against baseline
        run: checkov -d terraform --baseline terraform/.checkov.baseline --compact
